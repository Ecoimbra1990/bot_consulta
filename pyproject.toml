[tool.pytest.ini_options]
pythonpath = ["functions"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["__pycache__", ".pytest_cache", "venv", ".venv"]

[tool.ruff.lint]
ignore = ["BLE001"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
files = ["functions"]

[[tool.mypy.overrides]]
module = "app.bot.handlers"
disable_error_code = ["union-attr"]
