<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or 'Admin - Bot Consulta' }}</title>
  <style>
    body{font-family:Arial,sans-serif;margin:0;background:#f5f7fb;color:#1f2937}
    header{background:#111827;color:#fff;padding:12px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
    header a,header button.link{color:#d1d5db;text-decoration:none;background:none;border:none;padding:0;font:inherit;cursor:pointer}
    header a:hover,header button.link:hover{color:#fff}
    .wrap{padding:20px;max-width:1200px;margin:0 auto}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:14px}
    table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e5e7eb}
    th,td{padding:8px;border-bottom:1px solid #eee;font-size:14px;text-align:left;vertical-align:top}
    th{background:#f9fafb}
    form.inline{display:inline}
    input,select,button{padding:6px 8px;border:1px solid #ccc;border-radius:6px}
    button{background:#2563eb;color:#fff;border:none;cursor:pointer} button:hover{background:#1d4ed8}
    .muted{color:#6b7280;font-size:12px}
    .pager{margin-top:12px}
  </style>
</head>
<body>
<header>
  <strong>Bot Consulta Admin</strong>
  <a href="/admin/">Dashboard</a>
  <a href="/admin/users">Usuários</a>
  <a href="/admin/subscriptions">Assinaturas</a>
  <a href="/admin/payments">Pagamentos</a>
  <a href="/admin/queries">Consultas</a>
  <a href="/admin/dsr">LGPD</a>
  <a href="/admin/settings">Config</a>
  <span style="flex:1"></span>
  <span class="muted">{{ admin.email if admin else '' }}</span>
  <form class="inline" method="post" action="/admin/logout">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <button class="link" type="submit">Sair</button>
  </form>
</header>
<div class="wrap">
  {% block content %}{% endblock %}
</div>
</body>
</html>
