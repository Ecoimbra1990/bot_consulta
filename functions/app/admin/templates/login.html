<!doctype html>
<html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login Admin</title>
<style>body{font-family:Arial,sans-serif;background:#f3f4f6;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}.box{background:#fff;padding:24px;border-radius:10px;min-width:320px;border:1px solid #e5e7eb}input{width:100%;padding:10px;margin:6px 0 12px;border:1px solid #ccc;border-radius:6px;box-sizing:border-box}button{width:100%;padding:10px;background:#2563eb;color:#fff;border:none;border-radius:6px}.err{color:#b91c1c;margin-bottom:10px}</style></head>
<body><form class="box" method="post" action="/admin/login"><h2>Admin Login</h2>{% if error %}<div class="err">{{error}}</div>{% endif %}
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label>Email</label><input name="email" type="email" required><label>Senha</label><input name="password" type="password" required><button type="submit">Entrar</button></form></body></html>
