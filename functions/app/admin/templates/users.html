{% extends "layout.html" %}
{% block content %}
<h2>Usuários</h2>
<div class="card" style="margin-bottom:16px">
  <form method="post" action="/admin/users/create" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input name="name" placeholder="Nome">
    <input name="telegram_id" placeholder="Telegram ID">
    <input name="email" placeholder="Email (admin)" type="email">
    <input name="password" placeholder="Senha (mín. 12)" type="password">
    <select name="role"><option value="user">user</option><option value="admin">admin</option></select>
    <select name="status"><option value="pending">pending</option><option value="active">active</option><option value="blocked">blocked</option></select>
    <button type="submit">Criar</button>
  </form>
</div>
<table>
  <tr><th>ID</th><th>Nome</th><th>Telegram</th><th>Email</th><th>Role</th><th>Status</th><th>Ação</th></tr>
  {% for u in users %}
  <tr>
    <td>{{u.id}}</td><td>{{u.name or '-'}}</td><td>{{u.telegram_id or '-'}}</td><td>{{u.email or '-'}}</td><td>{{u.role}}</td><td>{{u.status}}</td>
    <td>
      <form class="inline" method="post" action="/admin/users/{{u.id}}/status">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <select name="status">
          {% for s in ['active','pending','blocked'] %}<option value="{{s}}" {% if u.status==s %}selected{% endif %}>{{s}}</option>{% endfor %}
        </select>
        <button type="submit">Salvar</button>
      </form>
    </td>
  </tr>
  {% endfor %}
</table>
{% if next_cursor %}<div class="pager"><a href="/admin/users?cursor={{next_cursor}}">Próxima página</a></div>{% endif %}
{% endblock %}
