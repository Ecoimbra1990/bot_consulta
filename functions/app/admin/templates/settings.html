{% extends "layout.html" %}
{% block content %}
<h2>Configurações</h2>
<div class="card">
  <p>Provedor de consultas: APIBrasil (único). Os endpoints são configurados por variáveis de ambiente/segredos.</p>
  <form method="post" action="/admin/settings" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Cache TTL (s)<input name="query_cache_ttl_seconds" type="number" min="1" value="{{ values.query_cache_ttl_seconds }}"></label>
    <label>Retenção do raw (dias)<input name="raw_retention_days" type="number" min="1" value="{{ values.raw_retention_days }}"></label>
    <label>Consultas/minuto<input name="queries_per_minute" type="number" min="1" value="{{ values.queries_per_minute }}"></label>
    <label>Versão do consentimento<input name="consent_version" value="{{ values.consent_version }}"></label>
    <button type="submit">Salvar</button>
  </form>
</div>
{% endblock %}
